<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <style>
        .registration-container {
            width: min(92%, 900px);
            max-width: 900px;
        }

        .registration-container .header {
            margin-bottom: 24px;
        }

        .registration-container .login-card {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .registration-container form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 22px;
        }

        .registration-container .form-group {
            min-width: 0;
        }

        .registration-container .form-group input {
            width: 100%;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 9px;
            font-size: 15px;
        }

        .registration-container .login-button {
            grid-column: 1 / -1;
            width: 100%;
            padding: 13px 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .registration-container .register-link {
            text-align: center;
            margin-bottom: 0;
        }

        @media (max-width: 700px) {
            .registration-container .login-card {
                padding: 22px;
            }

            .registration-container form {
                grid-template-columns: 1fr;
            }

            .registration-container .login-button {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container registration-container">

    <header class="header">
        <h1>📚 AI Library Assistant</h1>
        <p>Create your student account</p>
    </header>

    <section class="login-section">

        <div class="login-card">

            <h2>📝 Register</h2>

            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/register">

                <div class="form-group">
                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Student ID</label>

                    <input
                        type="text"
                        name="student_id"
                        placeholder="Enter your student ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        placeholder="Example: CSE"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <p class="register-link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </section>

</div>

</body>
</html>
