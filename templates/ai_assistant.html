<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Library Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#172554;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top a{color:white;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:9px 14px;border-radius:9px}.wrap{max-width:900px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(16,24,40,.06)}#chat{height:500px;overflow-y:auto;padding:10px}.row{margin:12px 0}.user{text-align:right}.msg{display:inline-block;max-width:80%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.5}.user .msg{background:#2563eb;color:white}.bot .msg{background:#eef2f7;color:#172033}.input{display:flex;gap:10px;margin-top:15px}.input input{flex:1;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.input button{padding:13px 20px;background:#2563eb;color:white;border:0;border-radius:10px;font-weight:600;cursor:pointer}.hint{color:#667085;font-size:14px;margin:0 0 10px}
</style>
</head>
<body>
<header class="top"><h1>📚 AI Library Assistant</h1><a href="/student-dashboard">← Dashboard</a></header>
<main class="wrap"><div class="card"><h2>Ask the Library AI</h2><p class="hint">Ask about books, authors, availability, shelf location, categories, or recommendations.</p><div id="chat"><div class="row bot"><span class="msg">Hello! I can help you find and understand books in the library.</span></div></div><div class="input"><input id="message" placeholder="Example: Is Clean Code available?" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Send</button></div></div></main>
<script>
async function sendMessage(){
 const input=document.getElementById('message'); const text=input.value.trim(); if(!text)return;
 addMessage(text,'user'); input.value='';
 addMessage('Thinking...','bot'); const thinking=document.getElementById('chat').lastElementChild;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||d.reply||'Unable to get a response.');
    thinking.querySelector('.msg').textContent=d.reply||'Unable to get a response.';
 }catch(e){thinking.querySelector('.msg').textContent='Unable to connect to the library assistant.';}
}
function addMessage(text,type){const box=document.getElementById('chat');const row=document.createElement('div');row.className='row '+type;const msg=document.createElement('span');msg.className='msg';msg.textContent=text;row.appendChild(msg);box.appendChild(row);box.scrollTop=box.scrollHeight;}
</script>
</body>
</html>
